<style>
/* ================================================================
   DESIGN TOKENS — matches the PY//LAB / PY//LEARN FUI theme
   ================================================================ */
:root{
  --bg:         #0b0f19;
  --bg-panel:   rgba(13, 20, 36, .82);
  --grid-line:  rgba(60, 130, 210, .07);
  --cyan:       #22d3ee;
  --cyan-dim:   rgba(34, 211, 238, .35);
  --cyan-faint: rgba(34, 211, 238, .12);
  --text:       #dbe7f4;
  --text-dim:   #7e93ad;
  --red:        #fb4d5c;
  --red-dim:    rgba(251, 77, 92, .35);
  --green:      #34d399;
  --green-dim:  rgba(52, 211, 153, .35);
  --amber:      #fbbf24;
  --font-ui:    'Chakra Petch', sans-serif;
  --font-mono:  'JetBrains Mono', monospace;
  --radius:     6px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; }
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 40% at 50% -5%, rgba(34,211,238,.06), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:100% 100%, 42px 42px, 42px 42px;
  color:var(--text);
  font-family:var(--font-ui);
}

.app{ display:flex; flex-direction:column; height:100vh; width:100vw; padding:12px; gap:12px; }
header{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:8px 16px;
  background:var(--bg-panel); border:1px solid var(--cyan-dim); border-radius:var(--radius);
  box-shadow:0 0 18px -6px var(--cyan-dim), inset 0 0 24px -18px var(--cyan);
  flex-wrap:wrap;
}
.brand{ font-weight:700; font-size:1rem; letter-spacing:.2em; color:var(--cyan); text-shadow:0 0 12px var(--cyan-dim); white-space:nowrap; }
.brand small{ color:var(--text-dim); letter-spacing:.12em; font-weight:500; }
.credit{ font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
  border-left:1px solid rgba(34,211,238,.25); padding-left:12px; user-select:none; white-space:nowrap; }
@media (max-width:1100px){ .credit{ display:none; } }
.status{ display:flex; align-items:center; gap:8px; font-size:.7rem; letter-spacing:.14em;
  color:var(--text-dim); text-transform:uppercase; white-space:nowrap; }
.status .dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulse 1.2s infinite; }
.status.ready .dot{ background:var(--green); box-shadow:0 0 8px var(--green); animation:none; }
.status.running .dot{ background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:pulse .7s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }
.spacer{ flex:1; }

.mode-tabs{ display:flex; gap:6px; }
.mode-tab{
  font-family:var(--font-ui); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-dim); cursor:pointer; background:rgba(34,211,238,.05);
  border:1px solid rgba(34,211,238,.2); border-radius:var(--radius); padding:8px 18px;
  transition:all .15s;
}
.mode-tab:hover{ color:var(--text); background:var(--cyan-faint); }
.mode-tab.active{
  color:#04141a; font-weight:700; background:linear-gradient(180deg,#67e8f9,var(--cyan));
  border-color:var(--cyan); box-shadow:0 0 16px -2px var(--cyan-dim);
}

.stage{ flex:1; min-height:0; display:none; gap:12px; }
.stage.active{ display:flex; }

.panel{
  position:relative; background:var(--bg-panel); border:1px solid var(--cyan-dim);
  border-radius:var(--radius); box-shadow:0 0 18px -8px var(--cyan-dim);
  display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
}
.panel::before, .panel::after{ content:""; position:absolute; width:14px; height:14px; pointer-events:none; z-index:3; }
.panel::before{ top:-1px; left:-1px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
.panel::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.panel-head{
  display:flex; align-items:center; gap:10px; padding:8px 14px; flex:0 0 auto;
  font-size:.7rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan);
  border-bottom:1px solid rgba(34,211,238,.18);
  background:linear-gradient(90deg, var(--cyan-faint), transparent 60%);
}
.panel-body{ flex:1; min-height:0; overflow-y:auto; padding:16px; }

button{
  font-family:var(--font-ui); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer; color:var(--text); background:rgba(34,211,238,.06);
  border:1px solid var(--cyan-dim); border-radius:var(--radius); padding:7px 14px;
  transition:box-shadow .15s, background .15s, transform .05s; white-space:nowrap;
}
button:hover{ background:var(--cyan-faint); box-shadow:0 0 12px -2px var(--cyan-dim); }
button:active{ transform:translateY(1px); }
button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
button.primary{
  color:#04141a; font-weight:700; background:linear-gradient(180deg,#67e8f9,var(--cyan));
  border-color:var(--cyan); box-shadow:0 0 14px -2px var(--cyan-dim);
}

/* LEARN */
.lesson-nav{ flex:0 0 250px; }
.lesson-nav .panel-body{ padding:10px; }
.nav-topic{ font-size:.66rem; letter-spacing:.18em; color:var(--text-dim); text-transform:uppercase; margin:12px 6px 6px; }
.nav-item{
  padding:8px 10px; margin-bottom:4px; border-radius:5px; cursor:pointer;
  font-size:.8rem; color:var(--text-dim); border:1px solid transparent; transition:all .15s;
}
.nav-item:hover{ color:var(--text); background:var(--cyan-faint); }
.nav-item.active{ color:var(--cyan); background:var(--cyan-faint); border-color:var(--cyan-dim); text-shadow:0 0 8px var(--cyan-dim); }
.lesson-main{ flex:1; }
.lesson-main .panel-body{ padding:20px 26px; }

.lesson h2{ font-size:1.15rem; letter-spacing:.06em; color:var(--cyan); margin-bottom:4px; }
.lesson .objective{ font-size:.72rem; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:16px; }
.lesson p{ font-size:.9rem; line-height:1.7; margin-bottom:12px; max-width:820px; }
.lesson ul{ margin:0 0 12px 22px; font-size:.9rem; line-height:1.7; max-width:800px; }
.lesson ol{ margin:0 0 12px 22px; font-size:.9rem; line-height:1.7; max-width:800px; }
.lesson table{ border-collapse:collapse; margin:0 0 14px; font-size:.85rem; }
.lesson th, .lesson td{ border:1px solid rgba(34,211,238,.25); padding:6px 14px; text-align:left; }
.lesson th{ color:var(--cyan); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; background:var(--cyan-faint); }
.lesson code{ font-family:var(--font-mono); font-size:.82em; color:#67e8f9; background:rgba(34,211,238,.08); padding:1px 5px; border-radius:3px; }
.callout{
  border-left:3px solid var(--amber); background:rgba(251,191,36,.06);
  padding:10px 14px; margin:0 0 14px; font-size:.84rem; line-height:1.6; max-width:800px; border-radius:0 5px 5px 0;
}
.callout.red{ border-left-color:var(--red); background:rgba(251,77,92,.07); }

/* anatomy diagram for function syntax */
.anatomy{
  border:1px solid rgba(34,211,238,.25); border-radius:var(--radius);
  background:rgba(5,9,18,.55); margin:0 0 18px; max-width:600px; overflow:visible;
  padding:18px 16px 26px; font-family:var(--font-mono); font-size:.86rem;
}
.anatomy .code-line{ position:relative; white-space:pre; line-height:1.6; }
.anatomy .tag{
  color:#67e8f9;
}
.anatomy .labels{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-family:var(--font-ui); }
.anatomy .lab{ font-size:.68rem; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
.anatomy .lab .dot{ width:8px; height:8px; border-radius:50%; background:var(--cyan); display:inline-block; }

.example{
  border:1px solid rgba(34,211,238,.25); border-radius:var(--radius);
  background:rgba(5,9,18,.55); margin:0 0 18px; max-width:820px; overflow:hidden;
}
.example .ex-head{
  display:flex; align-items:center; gap:10px; padding:6px 12px;
  border-bottom:1px solid rgba(34,211,238,.15);
  font-size:.64rem; letter-spacing:.16em; text-transform:uppercase; color:var(--text-dim);
}
.example .ex-head .predict{ color:var(--amber); border:1px solid rgba(251,191,36,.4); border-radius:3px; padding:1px 6px; }
.example .ex-head button{ margin-left:auto; padding:4px 10px; font-size:.64rem; }
.example pre{
  font-family:var(--font-mono); font-size:.82rem; line-height:1.65;
  padding:12px 14px; overflow-x:auto; color:var(--text); white-space:pre;
}
.example .ex-out{
  display:none; border-top:1px dashed rgba(34,211,238,.25);
  font-family:var(--font-mono); font-size:.8rem; line-height:1.6;
  padding:10px 14px; white-space:pre-wrap; word-break:break-word;
}
.example .ex-out .lbl{ color:var(--cyan); font-size:.62rem; letter-spacing:.16em; display:block; margin-bottom:4px; }
.example .ex-out .err{ color:#ffb3ba; }

/* PRACTICE */
.task-nav{ flex:0 0 250px; }
.task-nav .panel-body{ padding:10px; }
.task-item{ display:flex; align-items:center; gap:8px; }
.task-item .tick{ color:var(--green); font-size:.8rem; visibility:hidden; }
.task-item.done .tick{ visibility:visible; text-shadow:0 0 8px var(--green-dim); }
.practice-main{ flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
.practice-top{ flex:0 0 auto; max-height:34%; }
.practice-top .panel-body{ padding:14px 18px; }
.practice-top h3{ font-size:.95rem; color:var(--cyan); margin-bottom:6px; letter-spacing:.05em; }
.practice-top p{ font-size:.85rem; line-height:1.6; margin-bottom:8px; }
.practice-top code{ font-family:var(--font-mono); font-size:.8em; color:#67e8f9; background:rgba(34,211,238,.08); padding:1px 5px; border-radius:3px; }
.expected{
  font-family:var(--font-mono); font-size:.8rem; line-height:1.55; white-space:pre;
  border:1px dashed var(--cyan-dim); border-radius:5px; padding:8px 12px;
  background:rgba(5,9,18,.5); overflow-x:auto; max-width:640px; max-height:140px; overflow-y:auto;
}
.practice-editor{ flex:1.4; min-height:140px; }
.practice-editor .panel-body{ padding:0; overflow:hidden; display:flex; }
.practice-editor .panel-head .btns{ margin-left:auto; display:flex; gap:6px; }
.CodeMirror{
  height:100%; flex:1; background:rgba(5,9,18,.6); color:var(--text);
  font-family:var(--font-mono); font-size:.85rem; line-height:1.6;
}
.CodeMirror-gutters{ background:rgba(5,9,18,.85); border-right:1px solid rgba(34,211,238,.18); }
.CodeMirror-linenumber{ color:#3c4f66; }
.CodeMirror-cursor{ border-left:2px solid var(--cyan); }
.CodeMirror-selected{ background:rgba(34,211,238,.15) !important; }
.cm-s-default .cm-keyword{ color:#7dd3fc; } .cm-s-default .cm-builtin{ color:#67e8f9; }
.cm-s-default .cm-string{ color:#86efac; } .cm-s-default .cm-number{ color:#fbbf24; }
.cm-s-default .cm-comment{ color:#5b7089; font-style:italic; } .cm-s-default .cm-operator{ color:#c4b5fd; }

.practice-result{ flex:1; min-height:110px; }
.practice-result .panel-body{ font-family:var(--font-mono); font-size:.8rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.practice-result .placeholder{ color:var(--text-dim); font-style:italic; }
.verdict{ font-family:var(--font-ui); font-weight:700; letter-spacing:.1em; padding:6px 10px; border-radius:5px; display:inline-block; margin-bottom:10px; }
.verdict.pass{ color:var(--green); border:1px solid var(--green-dim); background:rgba(52,211,153,.08); text-shadow:0 0 10px var(--green-dim); }
.verdict.fail{ color:var(--red); border:1px solid var(--red-dim); background:rgba(251,77,92,.07); }
.diff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:760px; margin-top:6px; }
.diff-box{ border:1px solid rgba(34,211,238,.2); border-radius:5px; padding:8px 10px; background:rgba(5,9,18,.5); white-space:pre; overflow-x:auto; max-height:220px; overflow-y:auto; }
.diff-box.bad{ border-color:var(--red-dim); }
.diff-box .lbl{ font-size:.6rem; letter-spacing:.14em; color:var(--text-dim); display:block; margin-bottom:4px; }
.err-text{ color:#ffb3ba; }
.hint-text{ color:var(--amber); }

/* QUIZ */
#stage-quiz .panel{ flex:1; }
#stage-quiz .panel-body{ padding:20px 26px; }
.quiz-q{ border:1px solid rgba(34,211,238,.2); border-radius:var(--radius); background:rgba(5,9,18,.45); padding:14px 18px; margin-bottom:14px; max-width:860px; }
.quiz-q .q-text{ font-size:.9rem; line-height:1.6; margin-bottom:10px; }
.quiz-q .q-text code, .quiz-q label code{ font-family:var(--font-mono); font-size:.82em; color:#67e8f9; background:rgba(34,211,238,.08); padding:1px 5px; border-radius:3px; }
.quiz-q .q-num{ color:var(--cyan); font-weight:700; margin-right:6px; }
.quiz-q label{
  display:block; font-size:.85rem; padding:7px 12px; margin-bottom:6px; cursor:pointer;
  border:1px solid rgba(34,211,238,.15); border-radius:5px; transition:all .12s; line-height:1.5;
}
.quiz-q label:hover{ background:var(--cyan-faint); }
.quiz-q input{ accent-color:var(--cyan); margin-right:9px; }
.quiz-q.graded label{ cursor:default; }
.quiz-q label.correct{ border-color:var(--green); background:rgba(52,211,153,.1); box-shadow:0 0 10px -4px var(--green-dim); }
.quiz-q label.wrong{ border-color:var(--red); background:rgba(251,77,92,.08); }
.quiz-q .explain{ display:none; font-size:.8rem; color:var(--text-dim); border-top:1px dashed rgba(34,211,238,.2); margin-top:8px; padding-top:8px; line-height:1.6; }
.quiz-q.graded .explain{ display:block; }
#quiz-score{
  display:none; font-size:1rem; font-weight:700; letter-spacing:.1em;
  border:1px solid var(--cyan-dim); border-radius:var(--radius); padding:12px 18px;
  margin-bottom:16px; max-width:860px; background:var(--cyan-faint);
}
#quiz-score.great{ color:var(--green); border-color:var(--green-dim); background:rgba(52,211,153,.08); }
#quiz-score.ok{ color:var(--amber); }
#quiz-score.poor{ color:var(--red); border-color:var(--red-dim); }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(34,211,238,.25); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(34,211,238,.45); }

@media (max-width:900px){
  html,body{ overflow:auto; }
  .app{ height:auto; }
  .stage.active{ flex-direction:column; }
  .lesson-nav, .task-nav{ flex:0 0 auto; }
  .practice-top{ max-height:none; }
  .practice-editor{ min-height:260px; }
}
</style>

<div class="app">

  <!-- ================= HEADER ================= -->

      <div class="panel-head">Lesson Content <span id="lesson-tag" style="margin-left:auto;color:var(--text-dim);letter-spacing:.1em;"></span></div>

    <aside class="panel task-nav">
      <div class="panel-head">Challenges</div>

<script>
/* ====================================================================
   PY//LEARN — Topic 12 interactive courseware (vanilla JS)
   §0 Signature   — integrity-protected developer credit
   §1 Runtime     — Pyodide boot + runSnippet(): stdout/err capture
   §2 LEARN       — lesson data, nav, runnable example cards
   §3 PRACTICE    — challenges, CodeMirror, output/code checking
   §4 QUIZ        — MCQ data, grading, explanations
   ==================================================================== */

/* ============ §0 APPLICATION SIGNATURE (integrity-protected) ======== */
const _SIG_F = ["RGV2ZWxvcGVkIGJ5IA==", "UmFqZXNoIFIgTW9oYW4=", "IGZvciBJVEUgQ1c="];
const _SIG_H = 3332075197;
function _sigText(){ try{ return _SIG_F.map(f => atob(f)).join(""); }catch(e){ return ""; } }
function _sigHash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) + s.charCodeAt(i)) >>> 0; return h; }
function verifySignature(){ return _sigHash(_sigText()) === _SIG_H; }
function lockApp(){
  document.body.innerHTML =
    '<div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:monospace;color:#fb4d5c;background:#0b0f19;text-align:center;padding:20px;">' +
    '⛔ INTEGRITY CHECK FAILED<br><br>The application signature has been modified.<br>Restore the original file to continue.</div>';
  throw new Error("signature integrity failure");
}

const $ = id => document.getElementById(id);

/* ============ §1 PYTHON RUNTIME ===================================== */
let pyodide = null;

function setStatus(mode, text){
  const el = $("status");
  el.classList.remove("ready", "running");
  if (mode) el.classList.add(mode);
  $("status-text").textContent = text;
}

async function bootPyodide(){
  try{
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.23.4/full/" });
    pyodide.runPython(`
import builtins, js
def _browser_input(prompt_text=""):
    result = js.window.prompt(str(prompt_text))
    if result is None:
        raise EOFError("input() was cancelled by the user")
    print(str(prompt_text) + result)
    return result
builtins.input = _browser_input
`);
    setStatus("ready", "Python 3.11 ready");
  }catch(err){
    setStatus("", "Runtime failed to load — check internet & reload");
  }
}

async function runSnippet(code){
  if (!pyodide) return { out:"", err:"Python runtime is still loading — try again in a moment." };
  let out = "", err = "";
  pyodide.setStdout({ batched: t => { out += t + "\n"; } });
  pyodide.setStderr({ batched: t => { err += t + "\n"; } });
  setStatus("running", "Executing…");
  try{
    await pyodide.runPythonAsync(code);
  }catch(e){
    err += (e.message || String(e));
  }finally{
    setStatus("ready", "Python 3.11 ready");
  }
  return { out, err };
}

let activeTask = 0;
const taskState = TASKS.map(t => ({ code:t.starter, done:false }));

const taskEditor = CodeMirror.fromTextArea($("task-code"), {
  mode:"python", lineNumbers:true, indentUnit:4, smartIndent:true,

function renderTaskNav(){
  const list = $("task-nav-list");
  list.innerHTML = "";
  TASKS.forEach((t, i) => {
    const item = document.createElement("div");
    item.className = "nav-item task-item" + (i === activeTask ? " active" : "") + (taskState[i].done ? " done" : "");
    item.innerHTML = `<span class="tick">✔</span><span>${t.title}</span>`;
    item.addEventListener("click", () => selectTask(i));
    list.appendChild(item);
  });

function selectTask(i){
  taskState[activeTask].code = taskEditor.getValue();
  activeTask = i;
  const t = TASKS[i];
  $("task-brief").innerHTML = t.brief +
    (t.expected !== null
      ? `<div style="font-size:.68rem;letter-spacing:.14em;color:var(--text-dim);margin:6px 0 4px;">EXPECTED OUTPUT</div><div class="expected">${esc(t.expected)}</div>`
      : "");
  taskEditor.setValue(taskState[i].code);
  $("task-result").innerHTML = `<span class="placeholder">Run your code, then press “Check My Code” to test it against the expected output.</span>`;
  renderTaskNav();
  taskEditor.focus();
}

function normalise(text){
  const lines = text.replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/,""));
  while (lines.length && lines[lines.length-1] === "") lines.pop();
  return lines.join("\n");
}

async function runTask(check){
  if (!verifySignature()) return lockApp();
  taskState[activeTask].code = taskEditor.getValue();
  const t = TASKS[activeTask];
  const res = $("task-result");
  const r = await runSnippet(taskEditor.getValue());

  if (!check || (t.expected === null && !t.checkCode)){
    res.innerHTML =
      (r.out ? esc(r.out) : "") +
      (r.err ? `<div class="err-text">${esc(r.err)}</div>` : "") +
      (!r.out && !r.err ? `<span class="placeholder">(no output)</span>` : "");
    return;
  }

  let html = "";
  if (r.err){
    html += `<div class="verdict fail">✘ NOT YET — your program has an error</div>\n<div class="err-text">${esc(r.err)}</div>`;
    res.innerHTML = html; return;
  }

  const src = taskEditor.getValue();
  const misses = (t.mustContain || []).filter(rule => !rule.re.test(src)).map(rule => rule.msg);

  if (t.checkCode){
    if (misses.length === 0){
      taskState[activeTask].done = true;
      renderTaskNav();
      html += `<div class="verdict pass">✔ PASSED — program runs and uses the required structure!</div>\n${esc(r.out)}`;
    } else {
      html += `<div class="verdict fail">✘ NOT YET — keep trying</div><div class="hint-text">Hint: ${misses.map(esc).join(" ")}</div>\n${esc(r.out)}`;
    }
    res.innerHTML = html; return;
  }

  const got = normalise(r.out);
  const want = normalise(t.expected);
  const outputOK = got === want;

  if (outputOK && misses.length === 0){
    taskState[activeTask].done = true;
    renderTaskNav();
    html += `<div class="verdict pass">✔ PASSED — well done!</div>\n${esc(got)}`;
  } else {
    html += `<div class="verdict fail">✘ NOT YET — keep trying</div>`;
    if (misses.length) html += `<div class="hint-text">Hint: ${misses.map(esc).join(" ")}</div>`;
    if (!outputOK){
      html += `<div class="diff-grid">
        <div class="diff-box"><span class="lbl">EXPECTED</span>${esc(want)}</div>
        <div class="diff-box bad"><span class="lbl">YOUR OUTPUT</span>${got ? esc(got) : "<i>(no output)</i>"}</div>
      </div>`;
    } else {
      html += `\n${esc(got)}`;
    }
  }
  res.innerHTML = html;
}

$("btn-task-run").addEventListener("click", () => runTask(false));

function renderQuiz(){
  const list = $("quiz-list");
  list.innerHTML = "";
  QUIZ.forEach((item, qi) => {
    const box = document.createElement("div");
    box.className = "quiz-q";
    box.dataset.q = qi;
    let inner = `<div class="q-text"><span class="q-num">Q${qi + 1}.</span>${item.q}</div>`;
    item.opts.forEach((opt, oi) => {
      inner += `<label><input type="radio" name="q${qi}" value="${oi}"><code>${esc(opt)}</code></label>`;
    });
    inner += `<div class="explain">💡 ${item.ex}</div>`;

function gradeQuiz(){
  if (!verifySignature()) return lockApp();
  let score = 0, answered = 0;
  document.querySelectorAll(".quiz-q").forEach(box => {
    const qi = +box.dataset.q;
    const chosen = box.querySelector("input:checked");
    if (chosen) answered++;
    box.classList.add("graded");
    box.querySelectorAll("label").forEach((lab, oi) => {
      const input = lab.querySelector("input");
      input.disabled = true;
      if (oi === QUIZ[qi].a) lab.classList.add("correct");
      else if (chosen && +chosen.value === oi) lab.classList.add("wrong");
    });
    if (chosen && +chosen.value === QUIZ[qi].a) score++;
  });
  if (answered < QUIZ.length &&
      !confirm(`You have answered ${answered} of ${QUIZ.length} questions. Unanswered questions count as wrong — submit anyway?\n\n(Press Cancel, then Try Again to keep answering.)`)){
    renderQuiz(); return;
  }
  const pct = Math.round(score / QUIZ.length * 100);
  const scoreEl = $("quiz-score");
  scoreEl.className = pct >= 80 ? "great" : pct >= 50 ? "ok" : "poor";
  scoreEl.id = "quiz-score";
  scoreEl.style.display = "block";
  scoreEl.textContent =
    `SCORE: ${score} / ${QUIZ.length} (${pct}%) — ` +
    (pct >= 80 ? "Excellent! You have mastered Python functions. 🏆"
     : pct >= 50 ? "Good effort — review the explanations below, then try again."
     : "Keep practising — revisit the Learn tab, then try again.");
  $("btn-quiz-submit").disabled = true;
  scoreEl.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

$("btn-quiz-submit").addEventListener("click", gradeQuiz);
